name: Cazador de Empleo LegalOps

on:
  schedule:
    - cron: '0 11 * * 1-5' # Lunes a Viernes 7:00 AM Venezuela
  workflow_dispatch:

permissions:
  issues: write
  contents: write          # Permiso para guardar tus PDFs adaptados en el repo

jobs:
  buscar_ofertas:
    runs-on: ubuntu-latest
    steps:
      - name: Leer tu repositorio cvlegal
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías (Gemini + Generador PDF)
        run: pip install requests google-genai fpdf2

      - name: Ejecutar Agente Cazador y Generador de CV
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python cazador.py
